<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OCR 1年次 成績＆期末目標点シミュレーター Pro (ライトテーマ)</title>
  <style>
    :root {
      /* パステルカラー＆ライトケアテーマのカラー定義 */
      --bg-base: #f7f9fa;
      --bg-surface: #ffffff;
      --bg-elevated: #f0f4f6;
      --bg-glass: rgba(247, 249, 250, 0.9);
      
      --gold: #dcae1d;
      --gold-bright: #e5b82c;
      --gold-dim: rgba(220, 174, 29, 0.1);
      
      --coral: #f36c60; /* コーラルピンク (注意・警告) */
      --coral-bg: rgba(243, 108, 96, 0.12);
      
      --sky: #4fc3f7; /* スカイブルー (進捗・安心) */
      --sky-bg: rgba(79, 195, 247, 0.12);
      
      --mint: #26a69a; /* ミントグリーン (安全・合格) */
      --mint-bg: rgba(38, 166, 154, 0.12);

      --amber: #fb8c00; /* アンバー (中庸・プレテスト等) */
      --amber-bg: rgba(251, 140, 0, 0.12);
      
      --text-primary: #2c3e50;
      --text-secondary: #5d6d7e;
      --text-muted: #85929e;
      
      --border: #e2e8f0;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      
      --danger: var(--coral);
      --danger-bg: var(--coral-bg);
      --safe: var(--mint);
      --safe-bg: var(--mint-bg);
      --warn: var(--amber);
      --warn-bg: var(--amber-bg);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      max-width: 560px;
      margin: 0 auto;
      padding: 0 0 80px;
      line-height: 1.5;
    }

    /* Sticky Header - ライトガラス */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }

    .app-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      background: linear-gradient(135deg, var(--sky), var(--mint));
      padding: 3px 8px;
      border-radius: 6px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    .reset-mini-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reset-mini-btn:active {
      background: #e2e8f0;
    }

    /* 目標グレード・セグメント(コーラル＆スカイパステル) */
    .target-segment {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 800;
      padding: 6px 2px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .seg-btn span {
      display: block;
      font-size: 9px;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 1px;
    }

    .seg-btn.active {
      background: #ffffff;
      color: var(--text-primary);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0,0,0,0.02);
    }
    .seg-btn.active[data-val="60"] { color: var(--mint); }
    .seg-btn.active[data-val="70"] { color: var(--sky); }
    .seg-btn.active[data-val="80"] { color: var(--warn); }
    .seg-btn.active[data-val="90"] { color: var(--coral); }

    /* サマリーカード */
    .summary-strip {
      margin: 16px 14px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .sum-item {
      border-right: 1px solid var(--border);
    }
    .sum-item:last-child {
      border-right: none;
    }
    .sum-label {
      font-size: 10px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .sum-val {
      font-size: 17px;
      font-weight: 900;
      color: var(--sky);
    }

    /* カテゴリタブ */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 14px 12px;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex-shrink: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.01);
      transition: all 0.2s;
    }

    .cat-pill.active {
      background: var(--sky-bg);
      border-color: var(--sky);
      color: #0288d1;
    }

    /* 各科目カード */
    .cards-wrap {
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(149, 157, 165, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* 左側のパステルステータスインジケーター */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--sky);
    }

    .card.status-safe::before { background: var(--safe); }
    .card.status-warn::before { background: var(--warn); }
    .card.status-danger::before { background: var(--danger); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .subj-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .subj-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .term-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* 割合チップ */
    .ratio-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 14px;
    }

    .ratio-chip {
      font-size: 11px;
      font-weight: 600;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .ratio-chip.highlight {
      color: var(--sky);
      background: var(--sky-bg);
      border: 1px solid rgba(79, 195, 247, 0.2);
    }

    /* 情報表示パネル */
    .readout-panel {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .earned-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .earned-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .earned-num {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .earned-num small {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .formula-hint {
      font-size: 10px;
      color: var(--text-muted);
    }

    .target-block {
      text-align: right;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .target-caption {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .req-main {
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .req-main small {
      font-size: 12px;
      font-weight: 700;
      margin-left: 1px;
    }

    .req-exact {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 850;
      padding: 2px 8px;
      border-radius: 99px;
      margin-top: 4px;
    }

    /* 積算プログレスバー（超滑らか・即時追従） */
    .stack-container {
      margin-bottom: 16px;
    }

    .stack-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .stack-track {
      height: 12px;
      background: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      display: flex;
    }

    .stack-earned {
      height: 100%;
      background: linear-gradient(90deg, var(--sky), var(--mint));
      will-change: width;
    }

    .stack-needed {
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        rgba(38, 166, 154, 0.4),
        rgba(38, 166, 154, 0.4) 6px,
        rgba(38, 166, 154, 0.2) 6px,
        rgba(38, 166, 154, 0.2) 12px
      );
      will-change: width;
    }

    .stack-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #333333;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
      z-index: 5;
      will-change: left;
    }

    /* コントロール・入力調整エリア */
    .controls-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ctrl-item {
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      border: 1px solid var(--border);
    }

    .ctrl-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .ctrl-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ctrl-weighted {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .step-btn:active {
      background: var(--bg-elevated);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      outline: none;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--sky);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(79, 195, 247, 0.4);
      transition: transform 0.1s ease;
    }

    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.15);
    }

    .val-pill {
      min-width: 54px;
      text-align: right;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .syllabus-note {
      margin-top: 12px;
      padding: 8px 10px;
      background: rgba(0,0,0,0.01);
      border-left: 3px solid var(--sky);
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .syllabus-alert {
      margin-top: 10px;
      padding: 8px 10px;
      background: var(--danger-bg);
      border: 1px solid rgba(243, 108, 96, 0.2);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #9c3c34;
    }

    /* 筆記100%テーブル */
    .table-100 {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }
    .table-100 th, .table-100 td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .table-100 th {
      color: var(--text-secondary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 画面上部ライトガラス固定ヘッダー -->
  <div class="sticky-header">
    <div class="app-title-row">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="brand-badge">OCR PT1</span>
        <span class="app-title">シラバス成績＆期末目標シミュレーター</span>
      </div>
      <button class="reset-mini-btn" onclick="resetAll()">初期化</button>
    </div>

    <div class="target-segment">
      <button class="seg-btn active" data-val="60" onclick="setTarget(60)">60点<span>合格ライン</span></button>
      <button class="seg-btn" data-val="70" onclick="setTarget(70)">70点<span>良 (B)</span></button>
      <button class="seg-btn" data-val="80" onclick="setTarget(80)">80点<span>優 (A)</span></button>
      <button class="seg-btn" data-val="90" onclick="setTarget(90)">90点<span>秀 (S)</span></button>
    </div>
  </div>

  <!-- サマリー・進捗 -->
  <div class="summary-strip">
    <div class="sum-item">
      <div class="sum-label">目標総合ライン</div>
      <div class="sum-val" id="sum-target" style="color:var(--sky);">60点</div>
    </div>

    </div>
    <div class="sum-item">

      <div class="sum-val" id="sum-warn-count" style="color:var(--coral);">0科目</div>
    </div>
  </div>

  <!-- カテゴリ別フィルター -->
  <div class="cat-scroll">

    <button class="cat-pill" onclick="setFilter('practical')">演習・ゼミ・実習 (3科目)</button>
  </div>

  <div class="cards-wrap" id="cards-container"></div>

          { key: 'web_hw', label: '生理学Web宿題 クリア率', val: 100, min: 0, max: 100, unit: '%', weight: 0.10 }
        ]
      },
      {
        id: 'clinical_psych',
        name: '臨床心理学',
        teacher: '藤井 章乃 先生',
        category: 'second_mix',
        badge: '後期・必修 1単位 (全15回)',
        ratios: ['期末筆記 70%', 'レポート 30%'],
        finalExamWeight: 0.70,
        finalExamLabel: '後期末筆記試験',
        note: '授業最後の振り返り（感想・質問提出）とレポート（30%）が大きな比重を占めます。',
        inputs: [
          { key: 'report', label: 'レポート評価見込み', val: 80, min: 0, max: 100, unit: '点', weight: 0.30 }
        ]
      },
      {
        id: 'pt_eval',
        name: '理学療法評価学Ⅰ',
        teacher: '中平 剛志 先生 他',
        category: 'second_mix',
        badge: '後期・必修 4単位 (全30回)',
        ratios: ['期末筆記 90%', '実技試験 10%'],
        finalExamWeight: 0.90,
        finalExamLabel: '後期末筆記試験',
        note: '後期最大の4単位科目（触診・ROM・MMT・感覚・反射・片麻痺）。毎時間コマシラバスに全力。',
        inputs: [
          { key: 'practical', label: '実技試験の得点見込み', val: 80, min: 0, max: 100, unit: '点', weight: 0.10 }
        ]
      },
      {
        id: 'penalty_subjects',
        name: '地域福祉学 / 人間発達学',
        teacher: '山河 正裕 先生 / 松永 甫 先生',
        category: 'second_100',
        badge: '後期・筆記100%＋減点規定あり',
        ratios: ['期末筆記 100%', '無断欠席 -2点/回', '遅刻 -1点/回', '忘れ物・態度 -5点/回'],
        finalExamWeight: 1.00,
        isPenaltyMode: true,
        finalExamLabel: '後期末筆記試験',
        note: '両科目ともシラバスに「欠席 -2点、遅刻 -1点、必要物の忘れなど不良な学習態度 -5点」の明確な減点規定があります。',
        inputs: [
          { key: 'absence', label: '正当な理由のない欠席 (-2点/回)', val: 0, min: 0, max: 10, unit: '回', penalty: 2 },
          { key: 'late', label: '遅刻 (-1点/回)', val: 0, min: 0, max: 10, unit: '回', penalty: 1 },
          { key: 'forget', label: '忘れ物・不良な学習態度 (-5点/回)', val: 0, min: 0, max: 5, unit: '回', penalty: 5 }
        ]
      }
    ];

    let state = JSON.parse(JSON.stringify(SUBJECTS_DEFAULT));

    function loadStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.targetGrade) targetGrade = saved.targetGrade;
        if (saved.inputs) {
          state.forEach(subj => {
            if (saved.inputs[subj.id]) {
              subj.inputs.forEach(inp => {
                if (saved.inputs[subj.id][inp.key] !== undefined) {
                  inp.val = Number(saved.inputs[subj.id][inp.key]);
                }
              });
            }
          });
        }
      } catch (e) {}
    }

    // デバウンス保存でドラッグ中の同期I/Oフリーズを完全防止
    let saveTimeout = null;
    function debouncedSaveStorage() {
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveStorage, 300);
    }

    function saveStorage() {
      try {
        const payload = { targetGrade, inputs: {} };
        state.forEach(subj => {
          payload.inputs[subj.id] = {};
          subj.inputs.forEach(inp => {
            payload.inputs[subj.id][inp.key] = inp.val;
          });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
    }

    function calculateSubject(subj) {
      if (subj.isPenaltyMode) {
        let totalPenalty = 0;
        subj.inputs.forEach(i => { totalPenalty += i.val * i.penalty; });
        const exactReq = targetGrade + totalPenalty;
        return {
          earnedWeighted: -totalPenalty,
          maxPreExam: 0,
          exactReq: exactReq,
          ceilReq: Math.ceil(exactReq),
          neededWeighted: exactReq
        };
      } else {
        let earned = 0;
        subj.inputs.forEach(i => {
          earned += i.val * i.weight;
        });
        const maxPreExam = Math.round((1 - subj.finalExamWeight) * 100);
        const neededWeighted = Math.max(0, targetGrade - earned);
        const exactReq = neededWeighted / subj.finalExamWeight;
        return {
          earnedWeighted: Math.round(earned * 100) / 100,
          maxPreExam,
          exactReq: Math.max(0, Math.round(exactReq * 10) / 10),
          ceilReq: Math.max(0, Math.ceil(exactReq - 1e-9)),
          neededWeighted: Math.round(neededWeighted * 100) / 100
        };
      }
    }

    function getStatusInfo(ceilReq) {
      if (ceilReq <= 55) {
        return { cls: 'status-safe', color: 'var(--mint)', bg: 'var(--mint-bg)', label: '安全圏・余裕あり' };
      } else if (ceilReq <= 74) {
        return { cls: 'status-safe', color: 'var(--sky)', bg: 'var(--sky-bg)', label: '標準ターゲット' };
      } else if (ceilReq <= 100) {
        return { cls: 'status-warn', color: 'var(--warn)', bg: 'var(--warn-bg)', label: '重点対策が必要' };
      } else {
        return { cls: 'status-danger', color: 'var(--danger)', bg: 'var(--danger-bg)', label: '100点でも到達不可' };
      }
    }

    /* 高速差分更新（DOMを壊さずピンポイント書き換え） */
    function updateSubjectUI(subjId) {
      const subj = state.find(s => s.id === subjId);
      if (!subj) return;

      const calc = calculateSubject(subj);
      const st = getStatusInfo(calc.ceilReq);

      // 1. カードステータス枠線
      const card = document.getElementById(`card-${subj.id}`);
      if (card) {
        card.className = `card ${st.cls}`;
      }

      // 2. パネル数値更新
      const earnedNumEl = document.getElementById(`earned-num-${subj.id}`);
      if (earnedNumEl) {
        earnedNumEl.innerHTML = `${calc.earnedWeighted} <small>${subj.isPenaltyMode ? '点' : `/ ${calc.maxPreExam}点満点`}</small>`;
      }

      const formulaEl = document.getElementById(`formula-hint-${subj.id}`);
      if (formulaEl) {
        formulaEl.textContent = subj.isPenaltyMode
          ? `目標${targetGrade}点 + 減点${Math.abs(calc.earnedWeighted)}点`
          : `残り ${calc.neededWeighted}点分を期末(${Math.round(subj.finalExamWeight * 100)}%)で回収`;
      }

      const reqMainEl = document.getElementById(`req-main-${subj.id}`);
      if (reqMainEl) {
        reqMainEl.style.color = st.color;
        reqMainEl.innerHTML = `${calc.ceilReq}<small>点以上</small>`;
      }

      const reqExactEl = document.getElementById(`req-exact-${subj.id}`);
      if (reqExactEl) {
        reqExactEl.textContent = `（厳密計算値: ${calc.exactReq}点）`;
      }

      const statusBadgeEl = document.getElementById(`status-badge-${subj.id}`);
      if (statusBadgeEl) {
        statusBadgeEl.style.color = st.color;
        statusBadgeEl.style.background = st.bg;
        statusBadgeEl.textContent = st.label;
      }

      // 3. プログレスバー更新
      if (!subj.isPenaltyMode) {
        const earnedBarW = Math.min(100, Math.max(0, calc.earnedWeighted));
        const neededBarW = Math.min(100 - earnedBarW, Math.max(0, calc.neededWeighted));

        const barEarned = document.getElementById(`bar-earned-${subj.id}`);
        if (barEarned) barEarned.style.width = `${earnedBarW}%`;

        const barNeeded = document.getElementById(`bar-needed-${subj.id}`);
        if (barNeeded) barNeeded.style.width = `${neededBarW}%`;

        const marker = document.getElementById(`marker-${subj.id}`);
        if (marker) marker.style.left = `${targetGrade}%`;

        const stackEarnedText = document.getElementById(`stack-earned-text-${subj.id}`);
        if (stackEarnedText) stackEarnedText.textContent = `■ 現在の持ち点 (${calc.earnedWeighted}点)`;

        const stackNeededText = document.getElementById(`stack-needed-text-${subj.id}`);
        if (stackNeededText) stackNeededText.textContent = `■ 期末で必要 (+${calc.neededWeighted}点)`;
      }

      // 4. スライダー横の換算数値更新
      subj.inputs.forEach(inp => {
        const subtextEl = document.getElementById(`subtext-${subj.id}-${inp.key}`);
        if (subtextEl) {
          subtextEl.textContent = subj.isPenaltyMode
            ? `減点: -${inp.val * inp.penalty}点`
            : `換算: ${(inp.val * inp.weight).toFixed(1)}点 / ${Math.round(inp.weight * 100)}点`;
        }
        const valPillEl = document.getElementById(`val-pill-${subj.id}-${inp.key}`);
        if (valPillEl) {
          valPillEl.textContent = `${inp.val}${inp.unit}`;
        }
      });
    }

    /* サマリー更新 */
    function updateSummaryUI() {
      document.getElementById('sum-target').textContent = `${targetGrade}点`;
      let safeCount = 0;
      let warnCount = 0;
      state.forEach(s => {
        const res = calculateSubject(s);
        if (res.ceilReq <= 70) safeCount++;
        else warnCount++;
      });
      document.getElementById('sum-safe-count').textContent = `${safeCount}科目`;
      document.getElementById('sum-warn-count').textContent = `${warnCount}科目`;

      // 筆記100%テーブル内の必要点数更新
      document.querySelectorAll('.target-grade-cell').forEach(td => {
        td.textContent = `${targetGrade}点`;
      });
      const table100Hint = document.getElementById('table-100-hint');
      if (table100Hint) {
        table100Hint.innerHTML = `以下の4科目は期末試験100%評価のため、<strong>期末試験で「${targetGrade}点」を取ればそのまま総合${targetGrade}点</strong>になります。`;
      }
    }

    /* スライダー操作時：即時反映＆デバウンス保存 */
    function updateVal(subjId, key, newVal) {
      const subj = state.find(s => s.id === subjId);
      if (!subj) return;
      const inp = subj.inputs.find(i => i.key === key);
      if (!inp) return;
      const clamped = Math.max(inp.min, Math.min(inp.max, Number(newVal)));
      if (inp.val === clamped) return;
      inp.val = clamped;

      updateSubjectUI(subjId);
      updateSummaryUI();
      debouncedSaveStorage();
    }

    function stepVal(subjId, key, delta) {
      const subj = state.find(s => s.id === subjId);
      if (!subj) return;
      const inp = subj.inputs.find(i => i.key === key);
      if (!inp) return;
      const slider = document.getElementById(`slider-${subj.id}-${inp.key}`);
      const nextVal = Math.max(inp.min, Math.min(inp.max, inp.val + delta));
      if (slider) slider.value = nextVal;
      updateVal(subjId, key, nextVal);
      saveStorage();
    }

    function setTarget(score) {
      targetGrade = score;
      document.querySelectorAll('.seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-val') == score);
      });
      state.forEach(s => updateSubjectUI(s.id));
      updateSummaryUI();
      saveStorage();
    }

    function setFilter(cat) {
      activeFilter = cat;
      const order = ['all', 'annual', 'second_mix', 'second_100', 'practical'];
      document.querySelectorAll('.cat-pill').forEach((btn, i) => {
        btn.classList.toggle('active', order[i] === cat);
      });

      // 表示切り替えのみ（DOM再生成なしで最速）
      state.forEach(s => {
        const card = document.getElementById(`card-${s.id}`);
        if (card) {
          card.style.display = (cat === 'all' || s.category === cat) ? 'block' : 'none';
        }
      });

      const card100 = document.getElementById('card-second-100');
      if (card100) {
        card100.style.display = (cat === 'all' || cat === 'second_100') ? 'block' : 'none';
      }

      const cardPractical = document.getElementById('card-practical');
      if (cardPractical) {
        cardPractical.style.display = (cat === 'all' || cat === 'practical') ? 'block' : 'none';
      }
    }

    function resetAll() {
      state = JSON.parse(JSON.stringify(SUBJECTS_DEFAULT));
      localStorage.removeItem(STORAGE_KEY);
      state.forEach(s => {
        s.inputs.forEach(inp => {
          const slider = document.getElementById(`slider-${s.id}-${inp.key}`);
          if (slider) slider.value = inp.val;
        });
        updateSubjectUI(s.id);
      });
      updateSummaryUI();
    }

    /* 初期DOM構築（起動時1回のみ実行） */
    function initDOM() {
      const container = document.getElementById('cards-container');
      let html = '';

      state.forEach(subj => {
        const calc = calculateSubject(subj);
        const st = getStatusInfo(calc.ceilReq);

        const ratiosHtml = subj.ratios.map((r, idx) =>
          `<span class="ratio-chip ${idx === 0 ? 'highlight' : ''}">${r}</span>`
        ).join('');

        const controlsHtml = subj.inputs.map(inp => {
          const subText = subj.isPenaltyMode
            ? `減点: -${inp.val * inp.penalty}点`
            : `換算: ${(inp.val * inp.weight).toFixed(1)}点 / ${Math.round(inp.weight * 100)}点`;
          return `
            <div class="ctrl-item">
              <div class="ctrl-top">
                <span class="ctrl-title">${inp.label}</span>
                <span class="ctrl-weighted" id="subtext-${subj.id}-${inp.key}">${subText}</span>
              </div>
              <div class="slider-row">
                <button class="step-btn" onclick="stepVal('${subj.id}', '${inp.key}', -1)">−</button>
                <input type="range" id="slider-${subj.id}-${inp.key}" min="${inp.min}" max="${inp.max}" value="${inp.val}"
                  oninput="updateVal('${subj.id}', '${inp.key}', this.value)"
                  onchange="saveStorage()">
                <button class="step-btn" onclick="stepVal('${subj.id}', '${inp.key}', 1)">＋</button>
                <span class="val-pill" id="val-pill-${subj.id}-${inp.key}">${inp.val}${inp.unit}</span>
              </div>
            </div>
          `;
        }).join('');

        const earnedBarW = subj.isPenaltyMode ? 0 : Math.min(100, Math.max(0, calc.earnedWeighted));
        const neededBarW = subj.isPenaltyMode
          ? Math.min(100, targetGrade)
          : Math.min(100 - earnedBarW, Math.max(0, calc.neededWeighted));

        html += `
          <div class="card ${st.cls}" id="card-${subj.id}">
            <div class="card-top">
              <div>
                <div class="subj-name">${subj.name}</div>
                <div class="subj-meta">${subj.teacher}</div>
              </div>
              <span class="term-badge">${subj.badge}</span>
            </div>

            <div class="ratio-bar">${ratiosHtml}</div>

            <div class="readout-panel">
              <div class="earned-block">
                <span class="earned-label">${subj.isPenaltyMode ? '現在の累積減点' : '試験前の獲得持ち点'}</span>
                <div class="earned-num" id="earned-num-${subj.id}">
                  ${calc.earnedWeighted} <small>${subj.isPenaltyMode ? '点' : `/ ${calc.maxPreExam}点満点`}</small>
                </div>
                <span class="formula-hint" id="formula-hint-${subj.id}">
                  ${subj.isPenaltyMode
                    ? `目標${targetGrade}点 + 減点${Math.abs(calc.earnedWeighted)}点`
                    : `残り ${calc.neededWeighted}点分を期末(${Math.round(subj.finalExamWeight * 100)}%)で回収`}
                </span>
              </div>

              <div class="target-block">
                <div class="target-caption">${subj.finalExamLabel} (100点満点)</div>
                <div class="req-main" id="req-main-${subj.id}" style="color:${st.color}">
                  ${calc.ceilReq}<small>点以上</small>
                </div>
                <div class="req-exact" id="req-exact-${subj.id}">（厳密計算値: ${calc.exactReq}点）</div>
                <span class="status-badge" id="status-badge-${subj.id}" style="color:${st.color}; background:${st.bg}">${st.label}</span>
              </div>
            </div>

            ${!subj.isPenaltyMode ? `
              <div class="stack-container">
                <div class="stack-header">
                  <span id="stack-earned-text-${subj.id}">■ 現在の持ち点 (${calc.earnedWeighted}点)</span>
                  <span id="stack-needed-text-${subj.id}">■ 期末で必要 (+${calc.neededWeighted}点)</span>
                </div>
                <div class="stack-track">
                  <div class="stack-earned" id="bar-earned-${subj.id}" style="width:${earnedBarW}%"></div>
                  <div class="stack-needed" id="bar-needed-${subj.id}" style="width:${neededBarW}%"></div>
                  <div class="stack-marker" id="marker-${subj.id}" style="left:${targetGrade}%"></div>
                </div>
              </div>
            ` : ''}

            <div class="controls-list">${controlsHtml}</div>

            ${subj.alert ? `<div class="syllabus-alert">${subj.alert}</div>` : ''}
            ${subj.note ? `<div class="syllabus-note">${subj.note}</div>` : ''}
          </div>
        `;
      });

      // 筆記100%科目一覧カード
      html += `
        <div class="card status-safe" id="card-second-100">
          <div class="card-top">
            <div>
              <div class="subj-name">後期・筆記試験 100% 科目一覧</div>
              <div class="subj-meta">小テスト・レポート配分なし（期末試験の素点＝そのまま成績点）</div>
            </div>
            <span class="term-badge">後期・4科目</span>
          </div>
          <p id="table-100-hint" style="font-size:12.5px; color:var(--text-secondary); margin-bottom:8px;">
            以下の4科目は期末試験100%評価のため、<strong>期末試験で「${targetGrade}点」を取ればそのまま総合${targetGrade}点</strong>になります。
          </p>
          <table class="table-100">
            <thead>
              <tr>
                <th>科目名</th>
                <th>単位・回数</th>
                <th>担当教員</th>
                <th>必要素点</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>日常生活活動学</strong></td>
                <td>2単位 (15回)</td>
                <td>中平 剛志 先生</td>
                <td class="target-grade-cell" style="color:var(--sky); font-weight:800;">${targetGrade}点</td>
              </tr>
              <tr>
                <td><strong>人間関係学</strong></td>
                <td>2単位 (15回)</td>
                <td>鈴木 暁子 先生</td>
                <td class="target-grade-cell" style="color:var(--sky); font-weight:800;">${targetGrade}点</td>
              </tr>
              <tr>
                <td><strong>統計学</strong></td>
                <td>1単位 (8回)</td>
                <td>周藤 俊治 先生</td>
                <td class="target-grade-cell" style="color:var(--sky); font-weight:800;">${targetGrade}点</td>
              </tr>
              <tr>
                <td><strong>病理学概論</strong></td>
                <td>1単位 (8回)</td>
                <td>橋本 和明 先生</td>
                <td class="target-grade-cell" style="color:var(--sky); font-weight:800;">${targetGrade}点</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;

      // 実技・課題・実習科目カード
      html += `
        <div class="card" id="card-practical">
          <div class="card-top">
            <div>
              <div class="subj-name">実技・課題・実習 100% 科目</div>
              <div class="subj-meta">定期筆記試験なし（平常点・実技・課題で100%評価）</div>
            </div>
            <span class="term-badge">3科目</span>
          </div>
          <table class="table-100">
            <thead>
              <tr>
                <th>科目名</th>
                <th>評価内訳（シラバス原文準拠）</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>理学療法演習Ⅱ</strong><br><small style="color:var(--text-muted)">後期・必須 1単位</small></td>
                <td>実技の確認 <strong>40%</strong> ／ 課題提出 <strong>40%</strong> ／ 課題への取り組み・参加態度 <strong>20%</strong></td>
              </tr>
              <tr>
                <td><strong>臨床ゼミナールⅠ</strong><br><small style="color:var(--text-muted)">通年・必須 2単位</small></td>
                <td>平常点 <strong>100%</strong>（発言等の積極性、理解度、グループワーク貢献度、提出課題等）</td>
              </tr>
              <tr>
                <td><strong>評価臨床実習Ⅰ</strong><br><small style="color:var(--text-muted)">後期・必須 1単位</small></td>
                <td>実習関連（出席・デイリーノート・行動評価表・レポート）<strong>75%</strong> ／ 客観的臨床能力試験 <strong>25%</strong></td>
              </tr>
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    // 起動処理
    loadStorage();
    initDOM();
    document.querySelectorAll('.seg-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-val') == targetGrade);
    });
    updateSummaryUI();
  </script>
</body>
</html>
